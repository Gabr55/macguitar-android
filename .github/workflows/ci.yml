name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build:
    name: Linux CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update apt
        run: sudo apt update
      - name: Install alsa
        run: sudo apt-get install libasound2-dev
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Run tests
        run: cargo test --locked
      - name: Check cargo clippy warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  macos-build:
    name: macOS CI
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install llvm and clang
        run: brew install llvm
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --locked
      - name: Run tests
        run: cargo test --locked
      - name: Check cargo clippy warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  android-build:
    name: Android CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - name: Check cargo clippy warnings for Android phones
        # the NDK of the runner links the library the APK loads
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android30-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android30-clang"
          cargo clippy --locked --lib --target aarch64-linux-android -- -D warnings

  windows-build:
    name: windows CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ASIO SDK
        env:
          LINK: https://www.steinberg.net/asiosdk
        run: |
          curl -L -o asio.zip $env:LINK
          7z x -oasio asio.zip
          move asio\*\* asio\
      - name: Install ASIO4ALL
        run: choco install asio4all
      - name: Install llvm and clang
        run: choco install llvm
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: clippy
      - name: Build
        run: cargo build --locked
      - name: Run tests
        run: cargo test --locked
      - name: Check cargo clippy warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings